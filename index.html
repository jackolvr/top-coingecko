    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<body class="bg-slate-950">
    <div id="root"></div>

    <script type="module">
        const { useState, useEffect, useCallback, useRef, Fragment: Fr } = React;
        const { createRoot } = ReactDOM;

        // ============================================================
        // Constants
        // ============================================================
        const API_CG_MARKETS  = 'https://api.coingecko.com/api/v3/coins/markets';
        const BYBIT_BASE       = 'https://api.bybit.com/v5';
        const TIMEOUT_PADRAO   = 20000;

        // Scalping filter thresholds
        const F = {
            VOL_MIN_USD:    10_000_000,   // Volume USDT 24h mínimo
            VOLA_MIN:       5,            // Volatilidade 24h mínima %
            VOLA_MAX:       15,           // Volatilidade 24h máxima %
            RSI_MIN:        35,
            RSI_MAX:        65,
            MOM_1H_MIN:     2,            // Ganho 1h mínimo %
            MOM_1H_MAX:     8,
            MOM_4H_MIN:     3,
            MOM_4H_MAX:     12,
            VRATIO_MIN:     1.5,          // Volume vs média mínimo
            VRATIO_MAX:     3.0,
            SPREAD_MAX:     0.05,         // Spread máximo %
            DEPTH_MIN:      500_000,      // Profundidade mínima cada lado USD
        };

        // ============================================================
        // CORS Proxy chain
        // ============================================================
        const CORS_PROXIES = [
            url => url,
            url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
            url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
        ];

        async function fetchBybitJSON(url, signal) {
            for (const makeUrl of CORS_PROXIES) {
                if (signal?.aborted) throw new DOMException('Aborted', 'AbortError');
                try {
                    const res = await fetch(makeUrl(url), { signal });
                    if (!res.ok) continue;
                    const text = await res.text();
                    if (text.trimStart().startsWith('<')) continue;
                    return JSON.parse(text);
                } catch (e) {
                    if (e.name === 'AbortError') throw e;
                }
            }
            throw new Error('Todos os proxies falharam');
        }

        // ============================================================
        // Rate Limiter
        // ============================================================
        class RateLimiter {
            constructor(rps) {
                this.rps = rps;
                this.queue = [];
                this.ts = [];
                this.running = false;
            }
            execute(fn) {
                return new Promise((res, rej) => {
                    this.queue.push({ fn, res, rej });
                    if (!this.running) this._run();
                });
            }
            async _run() {
                this.running = true;
                while (this.queue.length) {
                    const now = Date.now();
                    this.ts = this.ts.filter(t => now - t < 1000);
                    if (this.ts.length >= this.rps) {
                        await new Promise(r => setTimeout(r, 1000 - (now - this.ts[0]) + 1));
                        continue;
                    }
                    const { fn, res, rej } = this.queue.shift();
                    this.ts.push(Date.now());
                    try { res(await fn()); } catch (e) { rej(e); }
                }
                this.running = false;
            }
        }
        const rl = new RateLimiter(20);

        // ============================================================
        // RSI – Wilder's smoothed method
        // ============================================================
        function calcularRSI(closes, p = 14) {
            if (!closes || closes.length < p + 1) return null;
            let g = 0, l = 0;
            for (let i = 1; i <= p; i++) {
                const d = closes[i] - closes[i - 1];
                d > 0 ? g += d : l -= d;
            }
            let ag = g / p, al = l / p;
            for (let i = p + 1; i < closes.length; i++) {
                const d = closes[i] - closes[i - 1];
                ag = (ag * (p - 1) + Math.max(0, d)) / p;
                al = (al * (p - 1) + Math.max(0, -d)) / p;
            }
            if (al === 0) return 100;
            return Math.round((100 - 100 / (1 + ag / al)) * 10) / 10;
        }

        // ============================================================
        // CoinGecko – Top 200 por market cap
        // ============================================================
        async function buscarCoinGeckoTop200() {
            const url = new URL(API_CG_MARKETS);
            url.searchParams.set('vs_currency', 'usd');
            url.searchParams.set('order', 'market_cap_desc');
            url.searchParams.set('per_page', '200');
            url.searchParams.set('page', '1');
            url.searchParams.set('sparkline', 'false');

            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), TIMEOUT_PADRAO);
            try {
                const res = await fetch(url.toString(), {
                    headers: { accept: 'application/json' },
                    signal: ctrl.signal,
                });
                clearTimeout(t);
                if (res.status === 429) throw new Error('Rate limit CoinGecko. Aguarde e tente novamente.');
                if (!res.ok) throw new Error(`CoinGecko: ${res.status} ${res.statusText}`);
                const dados = await res.json();
                if (!Array.isArray(dados)) throw new Error('Resposta CoinGecko inválida');
                // Mapa: bybitSymbol → { rank, nome, cg_id }
                const mapa = {};
                dados.forEach((c, i) => {
                    mapa[c.symbol.toUpperCase() + 'USDT'] = { rank: i + 1, nome: c.name, cg_id: c.id };
                });
                return mapa;
            } catch (e) {
                clearTimeout(t);
                throw e;
            }
        }

        // ============================================================
        // Bybit – Todos os tickers linear em uma chamada
        // ============================================================
        async function buscarTickersBybit() {
            const url = `${BYBIT_BASE}/market/tickers?category=linear`;
            const dados = await rl.execute(async () => {
                const ctrl = new AbortController();
                const t = setTimeout(() => ctrl.abort('timeout'), 15000);
                try {
                    const json = await fetchBybitJSON(url, ctrl.signal);
                    clearTimeout(t);
                    return json;
                } catch (e) { clearTimeout(t); throw e; }
            });
            if (dados.retCode !== 0 || !dados.result?.list) {
                throw new Error(`Bybit tickers: ${dados.retMsg}`);
            }
            const mapa = {};
            for (const t of dados.result.list) {
                if (!t.symbol.endsWith('USDT')) continue;
                const price    = parseFloat(t.lastPrice)   || 0;
                const prev1h   = parseFloat(t.prevPrice1h)  || 0;
                const prev24h  = parseFloat(t.prevPrice24h) || 0;
                const high24h  = parseFloat(t.highPrice24h) || 0;
                const low24h   = parseFloat(t.lowPrice24h)  || 0;
                const ask1     = parseFloat(t.ask1Price)    || 0;
                const bid1     = parseFloat(t.bid1Price)    || 0;
                mapa[t.symbol] = {
                    simbolo:         t.symbol,
                    preco:           price,
                    ganho_1h:        prev1h  > 0 ? ((price - prev1h)  / prev1h)  * 100 : 0,
                    ganho_24h:       prev24h > 0 ? ((price - prev24h) / prev24h) * 100 : 0,
                    volatilidade_24h: prev24h > 0 ? ((high24h - low24h) / prev24h) * 100 : 0,
                    volume_usd_24h:  parseFloat(t.turnover24h) || 0,
                    spread_pct:      ask1 > 0 ? ((ask1 - bid1) / ask1) * 100 : 999,
                    funding_rate:    parseFloat(t.fundingRate) * 100 || 0,
                };
            }
            return mapa;
        }

        // ============================================================
        // Bybit – Candlesticks (RSI + volume ratio + ganho candle)
        // ============================================================
        async function buscarCandles(symbol, interval, limit = 20) {
            const url = `${BYBIT_BASE}/market/kline?category=linear&symbol=${symbol}&interval=${interval}&limit=${limit}`;
            try {
                const dados = await rl.execute(async () => {
                    const ctrl = new AbortController();
                    const t = setTimeout(() => ctrl.abort('timeout'), 8000);
                    try {
                        const json = await fetchBybitJSON(url, ctrl.signal);
                        clearTimeout(t);
                        return json;
                    } catch (e) { clearTimeout(t); throw e; }
                });
                if (dados.retCode !== 0 || !dados.result?.list?.length) return null;

                // Bybit retorna mais recente primeiro → inverter para cronológico
                const candles = dados.result.list.slice().reverse().map(k => ({
                    open:   parseFloat(k[1]),
                    high:   parseFloat(k[2]),
                    low:    parseFloat(k[3]),
                    close:  parseFloat(k[4]),
                    volume: parseFloat(k[5]),
                }));

                const closes = candles.map(c => c.close);
                const rsi    = calcularRSI(closes);

                // Volume ratio: última vela vs SMA das anteriores
                const prev    = candles.slice(0, -1);
                const smaVol  = prev.length ? prev.reduce((s, c) => s + c.volume, 0) / prev.length : 0;
                const ultimo  = candles[candles.length - 1];
                const vRatio  = smaVol > 0 ? ultimo.volume / smaVol : 0;

                // Ganho da vela mais recente (open → close)
                const gainPct = ultimo.open > 0 ? ((ultimo.close - ultimo.open) / ultimo.open) * 100 : null;

                // Rejeição de níveis
                const rejeicao = analisarRejeicao(candles);

                return { rsi, vRatio, gainPct, candles, rejeicao };
            } catch (e) {
                console.warn(`[candles] ${symbol} ${interval}:`, e.message);
                return null;
            }
        }

        function analisarRejeicao(candles) {
            if (!candles?.length) return { tem: false, tipo: 'nenhuma', forca: 0 };
            const v     = candles[candles.length - 1]; // mais recente
            const prev  = candles.slice(0, -1);
            const sma   = prev.length ? prev.reduce((s, c) => s + c.volume, 0) / prev.length : 0;
            if (v.volume <= sma) return { tem: false, tipo: 'nenhuma', forca: 0 };

            const body  = Math.abs(v.close - v.open);
            const wtopo = v.high - Math.max(v.close, v.open);
            const wfund = Math.min(v.close, v.open) - v.low;
            const forca = w => body > 0 ? Math.round(Math.min(10, Math.max(1, (w / body) * 2))) : (w > 0 ? 10 : 0);

            if (wtopo > wfund * 1.5) return { tem: true, tipo: 'rejeicao_topo',  forca: forca(wtopo) };
            if (wfund > wtopo * 1.5) return { tem: true, tipo: 'rejeicao_fundo', forca: forca(wfund) };
            return { tem: false, tipo: 'nenhuma', forca: 0 };
        }

        // ============================================================
        // Bybit – Order book (spread real + profundidade)
        // ============================================================
        async function buscarLiquidez(symbol) {
            const url = `${BYBIT_BASE}/market/orderbook?category=linear&symbol=${symbol}&limit=50`;
            try {
                const dados = await rl.execute(async () => {
                    const ctrl = new AbortController();
                    const t = setTimeout(() => ctrl.abort('timeout'), 8000);
                    try {
                        const json = await fetchBybitJSON(url, ctrl.signal);
                        clearTimeout(t);
                        return json;
                    } catch (e) { clearTimeout(t); throw e; }
                });
                if (dados.retCode !== 0 || !dados.result) return { depth_bid: 0, depth_ask: 0, spread_pct: 999 };

                const bids = (dados.result.b || []).map(([p, s]) => ({ p: parseFloat(p), s: parseFloat(s) }));
                const asks = (dados.result.a || []).map(([p, s]) => ({ p: parseFloat(p), s: parseFloat(s) }));
                if (!bids.length || !asks.length) return { depth_bid: 0, depth_ask: 0, spread_pct: 999 };

                const mid       = (bids[0].p + asks[0].p) / 2;
                const spreadPct = asks[0].p > 0 ? ((asks[0].p - bids[0].p) / asks[0].p) * 100 : 999;

                // Profundidade dentro de 0.5% do mid price
                const depthBid = bids.filter(b => b.p >= mid * 0.995).reduce((s, b) => s + b.p * b.s, 0);
                const depthAsk = asks.filter(a => a.p <= mid * 1.005).reduce((s, a) => s + a.p * a.s, 0);

                return { depth_bid: depthBid, depth_ask: depthAsk, spread_pct: spreadPct };
            } catch (e) {
                console.warn(`[orderbook] ${symbol}:`, e.message);
                return { depth_bid: 0, depth_ask: 0, spread_pct: 999 };
            }
        }

        // ============================================================
        // Métricas completas por par (candlesticks + order book)
        // ============================================================
        async function calcularMetricasPar(par) {
            // 1h (RSI + vRatio), 15m (RSI), 4h (ganho candle) em paralelo + order book
            const [d1h, d15m, d4h, liq] = await Promise.all([
                buscarCandles(par.simbolo, '60',  20),
                buscarCandles(par.simbolo, '15',  20),
                buscarCandles(par.simbolo, '240', 10),
                buscarLiquidez(par.simbolo),
            ]);

            return {
                ...par,
                rsi_1h:       d1h?.rsi    ?? null,
                rsi_15m:      d15m?.rsi   ?? null,
                ganho_4h:     d4h?.gainPct ?? null,
                volume_ratio: d1h?.vRatio  ?? 0,
                rejeicao:     d1h?.rejeicao ?? { tem: false, tipo: 'nenhuma', forca: 0 },
                depth_bid:    liq.depth_bid,
                depth_ask:    liq.depth_ask,
                spread_pct:   liq.spread_pct < 999 ? liq.spread_pct : par.spread_pct,
            };
        }

        // ============================================================
        // Filtros (9 critérios)
        // ============================================================
        function verificarFiltros(par) {
            const g1h = Math.abs(par.ganho_1h  ?? 0);
            const g4h = par.ganho_4h !== null ? Math.abs(par.ganho_4h) : null;
            return {
                volume:       par.volume_usd_24h  >= F.VOL_MIN_USD,
                volatilidade: par.volatilidade_24h >= F.VOLA_MIN && par.volatilidade_24h <= F.VOLA_MAX,
                rsi_1h:       par.rsi_1h  !== null && par.rsi_1h  >= F.RSI_MIN && par.rsi_1h  <= F.RSI_MAX,
                rsi_15m:      par.rsi_15m !== null && par.rsi_15m >= F.RSI_MIN && par.rsi_15m <= F.RSI_MAX,
                momentum_1h:  g1h >= F.MOM_1H_MIN && g1h <= F.MOM_1H_MAX,
                momentum_4h:  g4h !== null && g4h >= F.MOM_4H_MIN && g4h <= F.MOM_4H_MAX,
                volume_ratio: par.volume_ratio >= F.VRATIO_MIN && par.volume_ratio <= F.VRATIO_MAX,
                spread:       par.spread_pct <= F.SPREAD_MAX,
                profundidade: par.depth_bid  >= F.DEPTH_MIN && par.depth_ask >= F.DEPTH_MIN,
            };
        }

        // ============================================================
        // Score 0–100 (contínuo, não binário)
        // ============================================================
        function calcularScore(par, filtros) {
            let s = 0;

            // Volume (0-20 pts) – escala log
            if (filtros.volume) {
                s += Math.min(20, 10 + Math.log10(par.volume_usd_24h / F.VOL_MIN_USD) * 5);
            }

            // Volatilidade (0-15 pts) – ótimo no centro da faixa
            if (filtros.volatilidade) {
                const center = (F.VOLA_MIN + F.VOLA_MAX) / 2;
                const range  = (F.VOLA_MAX - F.VOLA_MIN) / 2;
                s += Math.max(0, (1 - Math.abs(par.volatilidade_24h - center) / range) * 15);
            }

            // RSI (0-20 pts: 10+10)
            const rsiPts = (rsi, max) => {
                if (rsi === null) return 0;
                const center = (F.RSI_MIN + F.RSI_MAX) / 2;
                const range  = (F.RSI_MAX - F.RSI_MIN) / 2;
                return Math.max(0, (1 - Math.abs(rsi - center) / range) * max);
            };
            s += rsiPts(par.rsi_1h, 10);
            s += rsiPts(par.rsi_15m, 10);

            // Momentum (0-20 pts: 10+10)
            if (filtros.momentum_1h) s += 10;
            if (filtros.momentum_4h) s += 10;

            // Volume ratio (0-10 pts)
            if (filtros.volume_ratio) {
                const center = (F.VRATIO_MIN + F.VRATIO_MAX) / 2;
                const range  = (F.VRATIO_MAX - F.VRATIO_MIN) / 2;
                s += Math.max(0, (1 - Math.abs(par.volume_ratio - center) / range) * 10);
            }

            // Spread (0-10 pts)
            if (filtros.spread) {
                s += Math.max(0, 10 * (1 - par.spread_pct / F.SPREAD_MAX));
            }

            // Profundidade (0-15 pts) – escala log
            if (filtros.profundidade) {
                const minD = Math.min(par.depth_bid, par.depth_ask);
                s += Math.min(15, 5 + Math.log10(minD / F.DEPTH_MIN) * 5);
            }

            return Math.round(Math.min(100, Math.max(0, s)));
        }

        // ============================================================
        // Hook principal – sem auto-refresh
        // ============================================================
        function useScalpingData() {
            const [estado,   setEstado]   = useState('idle');   // idle | carregando | concluido | erro
            const [fase,     setFase]     = useState('');
            const [prog,     setProg]     = useState(0);
            const [pares,    setPares]    = useState([]);
            const [erro,     setErro]     = useState(null);
            const [atualizado, setAtualizado] = useState(null);
            const [stats,    setStats]    = useState(null);
            const [atualizandoFiltradas, setAtualizandoFiltradas] = useState(false);
            const paresRef = useRef([]);
            useEffect(() => { paresRef.current = pares; }, [pares]);

            const atualizarFiltradas = useCallback(async () => {
                const lista = paresRef.current;
                if (!lista.length || atualizandoFiltradas) return;
                setAtualizandoFiltradas(true);
                try {
                    // Re-fetch tickers para preços/indicadores atualizados
                    const bybitMapa = await buscarTickersBybit();

                    // Re-fetch candlesticks + order book para cada par exibido
                    const comMetricas = await Promise.all(
                        lista.map(async par => {
                            const ticker = bybitMapa[par.simbolo];
                            const base   = ticker ? { ...par, ...ticker } : par;
                            return calcularMetricasPar(base);
                        })
                    );

                    const resultados = comMetricas
                        .filter(Boolean)
                        .map(par => {
                            const filtros   = verificarFiltros(par);
                            const score     = calcularScore(par, filtros);
                            const filtrosOk = Object.values(filtros).filter(Boolean).length;
                            return { ...par, filtros, score, filtrosOk };
                        })
                        .sort((a, b) => b.score !== a.score ? b.score - a.score : b.filtrosOk - a.filtrosOk);

                    setPares(resultados);
                    setAtualizado(Date.now());
                } catch (e) {
                    console.warn('[atualizarFiltradas]', e.message);
                } finally {
                    setAtualizandoFiltradas(false);
                }
            }, [atualizandoFiltradas]);

            const buscarDados = useCallback(async () => {
                setEstado('carregando');
                setErro(null);
                setProg(0);
                setPares([]);
                setStats(null);

                try {
                    // Fase 1 – CoinGecko + Bybit tickers em paralelo
                    setFase('Buscando top 200 CoinGecko e tickers Bybit...');
                    const [cgMapa, bybitMapa] = await Promise.all([
                        buscarCoinGeckoTop200(),
                        buscarTickersBybit(),
                    ]);
                    setProg(25);

                    // Fase 2 – Cross-reference + pré-filtro de volume
                    setFase('Cruzando dados e filtrando candidatos...');
                    const candidatos = [];
                    for (const [sym, cg] of Object.entries(cgMapa)) {
                        const ticker = bybitMapa[sym];
                        if (!ticker) continue;
                        if (ticker.volume_usd_24h < F.VOL_MIN_USD) continue;
                        candidatos.push({ ...cg, ...ticker });
                    }
                    // Ordenar por rank de market cap, limitar a 50 para análise detalhada
                    candidatos.sort((a, b) => a.rank - b.rank);
                    const top50 = candidatos.slice(0, 50);
                    setProg(35);

                    if (top50.length === 0) {
                        setStats({ totalBybit: Object.keys(bybitMapa).length, candidatos: 0, exibidos: 0 });
                        setEstado('concluido');
                        setAtualizado(Date.now());
                        return;
                    }

                    // Fase 3 – Candlesticks + order book em paralelo por par
                    setFase(`Calculando RSI e liquidez para ${top50.length} candidatos...`);
                    let done = 0;
                    const comMetricas = await Promise.all(
                        top50.map(async par => {
                            const resultado = await calcularMetricasPar(par);
                            done++;
                            setProg(35 + Math.round((done / top50.length) * 55));
                            return resultado;
                        })
                    );

                    // Fase 4 – Filtros, score, ordenação
                    setFase('Aplicando filtros e calculando scores...');
                    const resultados = comMetricas
                        .filter(Boolean)
                        .map(par => {
                            const filtros   = verificarFiltros(par);
                            const score     = calcularScore(par, filtros);
                            const filtrosOk = Object.values(filtros).filter(Boolean).length;
                            return { ...par, filtros, score, filtrosOk };
                        })
                        .sort((a, b) => b.score !== a.score ? b.score - a.score : b.filtrosOk - a.filtrosOk)
                        .slice(0, 20);

                    setPares(resultados);
                    setStats({ totalBybit: Object.keys(bybitMapa).length, candidatos: top50.length, exibidos: resultados.length });
                    setAtualizado(Date.now());
                    setEstado('concluido');
                    setProg(100);
                } catch (e) {
                    setErro(`❌ ${e.message}`);
                    setEstado('erro');
                }
            }, []);

            // Busca única ao montar
            useEffect(() => { buscarDados(); }, [buscarDados]);

            return { pares, estado, fase, prog, erro, atualizado, stats, buscarDados, atualizarFiltradas, atualizandoFiltradas };
        }

        // ============================================================
        // Helpers de formatação
        // ============================================================
        function fmtUSD(v) {
            if (!v || v <= 0) return '$0';
            if (v >= 1e9) return `$${(v / 1e9).toFixed(1)}B`;
            if (v >= 1e6) return `$${(v / 1e6).toFixed(1)}M`;
            if (v >= 1e3) return `$${(v / 1e3).toFixed(0)}K`;
            return `$${v.toFixed(0)}`;
        }

        function fmtPreco(p) {
            if (p >= 1000) return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(p);
            if (p >= 1)    return `$${p.toFixed(4)}`;
            return `$${p.toFixed(8)}`;
        }

        function corRSI(rsi) {
            if (rsi === null) return 'text-slate-500';
            if (rsi < F.RSI_MIN || rsi > F.RSI_MAX) return 'text-red-400';
            if (Math.abs(rsi - 50) < 8) return 'text-green-400';
            return 'text-yellow-400';
        }

        function corGanho(g, min, max) {
            if (g === null) return 'text-slate-500';
            const abs = Math.abs(g);
            if (abs >= min && abs <= max) return g > 0 ? 'text-green-400' : 'text-red-400';
            return 'text-slate-500';
        }

        // ============================================================
        // Componentes de célula
        // ============================================================
        function CelulaMudanca({ v }) {
            const cor = v >= 0 ? 'text-green-500' : 'text-red-500';
            return React.createElement('span', { className: `font-semibold ${cor}` },
                `${v >= 0 ? '+' : ''}${v.toFixed(2)}%`);
        }

        function CelulaVolumeVola({ vol, vola }) {
            const vOk = vol >= F.VOL_MIN_USD;
            const vtOk = vola >= F.VOLA_MIN && vola <= F.VOLA_MAX;
            const vtCor = vtOk ? 'text-green-400' : (vola > F.VOLA_MAX ? 'text-red-400' : 'text-slate-500');
            return React.createElement('div', { className: 'text-xs flex flex-col gap-0.5' },
                React.createElement('span', { className: vOk ? 'text-cyan-400' : 'text-slate-500' }, fmtUSD(vol)),
                React.createElement('span', { className: vtCor }, `${vola?.toFixed(1) ?? '—'}% 24h`),
            );
        }

        function CelulaRSI({ rsi1h, rsi15m }) {
            return React.createElement('div', { className: 'text-xs flex flex-col gap-0.5' },
                React.createElement('span', { className: corRSI(rsi1h) },  `1h:  ${rsi1h  !== null ? rsi1h.toFixed(0)  : '—'}`),
                React.createElement('span', { className: corRSI(rsi15m) }, `15m: ${rsi15m !== null ? rsi15m.toFixed(0) : '—'}`),
            );
        }

        function CelulaMomentum({ g1h, g4h }) {
            const fmt = (v, label) => {
                if (v === null) return `${label}: —`;
                return `${v >= 0 ? '↑' : '↓'}${label}: ${Math.abs(v).toFixed(1)}%`;
            };
            return React.createElement('div', { className: 'text-xs flex flex-col gap-0.5' },
                React.createElement('span', { className: corGanho(g1h, F.MOM_1H_MIN, F.MOM_1H_MAX) }, fmt(g1h, '1h')),
                React.createElement('span', { className: corGanho(g4h, F.MOM_4H_MIN, F.MOM_4H_MAX) }, fmt(g4h, '4h')),
            );
        }

        function CelulaLiquidez({ spread, dBid, dAsk }) {
            const sOk  = spread <= F.SPREAD_MAX;
            const sCor = sOk ? 'text-green-400' : (spread < 0.1 ? 'text-yellow-400' : 'text-red-400');
            const bOk  = dBid >= F.DEPTH_MIN;
            const aOk  = dAsk >= F.DEPTH_MIN;
            return React.createElement('div', { className: 'text-xs flex flex-col gap-0.5' },
                React.createElement('span', { className: sCor }, `${spread?.toFixed(3) ?? '—'}%`),
                React.createElement('span', { className: aOk ? 'text-emerald-400' : 'text-slate-500' }, `↑${fmtUSD(dAsk)}`),
                React.createElement('span', { className: bOk ? 'text-orange-400' : 'text-slate-500' },  `↓${fmtUSD(dBid)}`),
            );
        }

        function CelulaScore({ score, filtrosOk }) {
            if (score == null) return React.createElement('span', { className: 'text-slate-500 text-xs' }, '—');
            const ind = score > 70 ? '🟢' : (score >= 50 ? '🟡' : '🔴');
            return React.createElement('div', { className: 'flex flex-col items-center gap-0.5' },
                React.createElement('div', { className: 'flex items-center gap-1' },
                    React.createElement('span', null, ind),
                    React.createElement('span', { className: 'font-bold text-white' }, score),
                ),
                React.createElement('span', { className: 'text-slate-500 text-xs' }, `${filtrosOk}/9`),
            );
        }

        function CelulaFiltros({ filtros }) {
            if (!filtros) return React.createElement('span', { className: 'text-slate-500 text-xs' }, '—');
            const items = [
                { k: 'V',   ok: filtros.volume,       t: `Vol > $${F.VOL_MIN_USD/1e6}M` },
                { k: 'Vt',  ok: filtros.volatilidade,  t: `Volatil. ${F.VOLA_MIN}-${F.VOLA_MAX}%` },
                { k: 'R1',  ok: filtros.rsi_1h,        t: `RSI 1h: ${F.RSI_MIN}-${F.RSI_MAX}` },
                { k: 'R5',  ok: filtros.rsi_15m,       t: `RSI 15m: ${F.RSI_MIN}-${F.RSI_MAX}` },
                { k: 'M1',  ok: filtros.momentum_1h,   t: `Mom. 1h: ${F.MOM_1H_MIN}-${F.MOM_1H_MAX}%` },
                { k: 'M4',  ok: filtros.momentum_4h,   t: `Mom. 4h: ${F.MOM_4H_MIN}-${F.MOM_4H_MAX}%` },
                { k: 'Vr',  ok: filtros.volume_ratio,  t: `Vol.Ratio: ${F.VRATIO_MIN}-${F.VRATIO_MAX}x` },
                { k: 'Sp',  ok: filtros.spread,        t: `Spread < ${F.SPREAD_MAX}%` },
                { k: 'Pr',  ok: filtros.profundidade,  t: `Prof. > $${F.DEPTH_MIN/1e3}K cada lado` },
            ];
            return React.createElement('div', { className: 'flex gap-0.5 items-center justify-center flex-wrap' },
                items.map(f => React.createElement('span', { key: f.k, title: f.t, className: 'text-xs cursor-help' },
                    f.ok ? '✅' : '❌')));
        }

        function BarraProgresso({ prog, fase }) {
            return React.createElement('div', { className: 'px-8 py-6 space-y-3' },
                React.createElement('div', { className: 'flex justify-between items-center text-xs text-slate-400' },
                    React.createElement('span', { className: 'truncate max-w-xs' }, fase),
                    React.createElement('span', { className: 'text-cyan-400 font-medium ml-2' }, `${prog}%`),
                ),
                React.createElement('div', { className: 'w-full bg-slate-700/50 rounded-full h-1.5' },
                    React.createElement('div', {
                        className: 'bg-gradient-to-r from-cyan-600 to-cyan-400 h-1.5 rounded-full transition-all duration-500',
                        style: { width: `${prog}%` },
                    }),
                ),
            );
        }

        function LinhaTabela({ par }) {
            return React.createElement('tr', { className: 'border-b border-slate-700 hover:bg-slate-800/50 transition-colors' },
                // Par + rank
                React.createElement('td', { className: 'px-3 py-3 text-left' },
                    React.createElement('div', { className: 'flex flex-col' },
                        React.createElement('span', { className: 'font-medium text-slate-100 text-sm' }, par.simbolo),
                        React.createElement('span', { className: 'text-slate-500 text-xs' }, `#${par.rank} MktCap`),
                    ),
                ),
                // Preço
                React.createElement('td', { className: 'px-3 py-3 text-right font-mono text-slate-300 text-sm whitespace-nowrap' },
                    fmtPreco(par.preco)),
                // 24h%
                React.createElement('td', { className: 'px-3 py-3 text-right' },
                    React.createElement(CelulaMudanca, { v: par.ganho_24h })),
                // Volume + Volatilidade
                React.createElement('td', { className: 'px-3 py-3 text-center' },
                    React.createElement(CelulaVolumeVola, { vol: par.volume_usd_24h, vola: par.volatilidade_24h })),
                // RSI
                React.createElement('td', { className: 'px-3 py-3 text-center' },
                    React.createElement(CelulaRSI, { rsi1h: par.rsi_1h, rsi15m: par.rsi_15m })),
                // Momentum
                React.createElement('td', { className: 'px-3 py-3 text-center' },
                    React.createElement(CelulaMomentum, { g1h: par.ganho_1h, g4h: par.ganho_4h })),
                // Spread / Profundidade
                React.createElement('td', { className: 'px-3 py-3 text-center' },
                    React.createElement(CelulaLiquidez, { spread: par.spread_pct, dBid: par.depth_bid, dAsk: par.depth_ask })),
                // Score
                React.createElement('td', { className: 'px-3 py-3 text-center' },
                    React.createElement(CelulaScore, { score: par.score, filtrosOk: par.filtrosOk })),
                // Filtros
                React.createElement('td', { className: 'px-3 py-3 text-center' },
                    React.createElement(CelulaFiltros, { filtros: par.filtros })),
            );
        }

        // ============================================================
        // App principal
        // ============================================================
        function App() {
            const { pares, estado, fase, prog, erro, atualizado, stats, buscarDados, atualizarFiltradas, atualizandoFiltradas } = useScalpingData();
            const carregando = estado === 'carregando';

            const cabecalhos = [
                { label: 'Par',             align: 'text-left' },
                { label: 'Preço',           align: 'text-right' },
                { label: '24h %',           align: 'text-right' },
                { label: 'Vol / Volatil.',  align: 'text-center' },
                { label: 'RSI',             align: 'text-center' },
                { label: 'Momentum',        align: 'text-center' },
                { label: 'Spread / Prof.',  align: 'text-center' },
                { label: 'Score',           align: 'text-center' },
                { label: 'Filtros (9)',     align: 'text-center' },
            ];

            return React.createElement('div', { className: 'min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950' },
                // Background grid
                React.createElement('div', {
                    className: 'absolute inset-0 opacity-5 pointer-events-none',
                    style: {
                        backgroundImage: 'linear-gradient(0deg, transparent 24%, rgba(15,23,42,0.3) 25%, rgba(15,23,42,0.3) 26%, transparent 27%, transparent 74%, rgba(15,23,42,0.3) 75%, rgba(15,23,42,0.3) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(15,23,42,0.3) 25%, rgba(15,23,42,0.3) 26%, transparent 27%, transparent 74%, rgba(15,23,42,0.3) 75%, rgba(15,23,42,0.3) 76%, transparent 77%, transparent)',
                        backgroundSize: '50px 50px',
                    },
                }),

                React.createElement('div', { className: 'relative z-10 max-w-7xl mx-auto px-4 py-12' },

                    // Header
                    React.createElement('div', { className: 'mb-12 text-center' },
                        React.createElement('div', { className: 'flex items-center justify-center gap-3 mb-4' },
                            React.createElement('div', { className: 'relative' },
                                React.createElement('div', { className: 'absolute inset-0 bg-cyan-500 blur-xl opacity-30 rounded-full' }),
                                React.createElement('svg', {
                                    className: 'relative w-12 h-12 text-cyan-400',
                                    viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor',
                                    strokeWidth: '1.5', strokeLinecap: 'round', strokeLinejoin: 'round',
                                },
                                    React.createElement('polyline', { points: '23 6 13.5 15.5 8.5 10.5 1 17' }),
                                    React.createElement('polyline', { points: '17 6 23 6 23 12' }),
                                ),
                            ),
                            React.createElement('h1', { className: 'text-5xl font-bold text-white tracking-tight' }, 'Scalping Scanner'),
                        ),
                        React.createElement('p', { className: 'text-slate-400 text-lg mb-2' }, 'Pares Perpétuos USDT da Bybit'),
                        React.createElement('p', { className: 'text-slate-500 text-sm' }, 'Top 200 por Market Cap · 9 Filtros de Scalping'),
                    ),

                    // Main card
                    React.createElement('div', { className: 'bg-slate-900/60 backdrop-blur-xl border border-slate-800 rounded-xl shadow-2xl overflow-hidden' },

                        // Action bar
                        React.createElement('div', { className: 'flex items-center justify-between px-8 py-5 bg-slate-800/40 border-b border-slate-800' },
                            React.createElement('div', { className: 'flex flex-col gap-1' },
                                atualizado
                                    ? React.createElement('div', { className: 'text-sm text-slate-400' },
                                        '🔵 CoinGecko · 🟡 Bybit — ',
                                        React.createElement('span', { className: 'text-cyan-400 font-semibold' },
                                            new Date(atualizado).toLocaleTimeString('pt-BR')),
                                    )
                                    : React.createElement('div', { className: 'text-sm text-slate-500' }, 'Aguardando dados...'),
                                stats && React.createElement('div', { className: 'text-xs text-slate-500' },
                                    `${stats.totalBybit} pares Bybit · ${stats.candidatos} candidatos analisados · Top ${stats.exibidos} exibidos`),
                            ),
                            React.createElement('button', {
                                onClick: buscarDados,
                                disabled: carregando,
                                className: 'inline-flex items-center gap-2 px-4 py-2 bg-cyan-600 hover:bg-cyan-700 disabled:opacity-50 disabled:cursor-not-allowed text-white rounded-lg transition-all font-medium text-sm',
                            },
                                React.createElement('svg', {
                                    className: `w-4 h-4 ${carregando ? 'animate-spin' : ''}`,
                                    viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor',
                                    strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round',
                                },
                                    React.createElement('polyline', { points: '23 4 23 10 17 10' }),
                                    React.createElement('polyline', { points: '1 20 1 14 7 14' }),
                                    React.createElement('path', { d: 'M3.51 9a9 9 0 0 1 14.85-3.36M20.49 15a9 9 0 0 1-14.85 3.36' }),
                                ),
                                carregando ? 'Analisando...' : 'Atualizar',
                            ),
                            // Botão atualizar só os pares filtrados
                            pares.length > 0 && React.createElement('button', {
                                onClick: atualizarFiltradas,
                                disabled: carregando || atualizandoFiltradas,
                                title: 'Atualiza RSI, momentum e liquidez apenas dos pares já exibidos',
                                className: 'inline-flex items-center gap-2 px-4 py-2 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 disabled:cursor-not-allowed text-slate-200 rounded-lg transition-all font-medium text-sm',
                            },
                                React.createElement('svg', {
                                    className: `w-4 h-4 ${atualizandoFiltradas ? 'animate-spin' : ''}`,
                                    viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor',
                                    strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round',
                                },
                                    React.createElement('polyline', { points: '23 4 23 10 17 10' }),
                                    React.createElement('polyline', { points: '1 20 1 14 7 14' }),
                                    React.createElement('path', { d: 'M3.51 9a9 9 0 0 1 14.85-3.36M20.49 15a9 9 0 0 1-14.85 3.36' }),
                                ),
                                atualizandoFiltradas ? 'Atualizando...' : '🔄️ filtradas',
                            ),
                        ),

                        // Legend bar
                        React.createElement('div', { className: 'px-6 py-2 bg-slate-800/20 border-b border-slate-800 flex flex-wrap gap-x-4 gap-y-1 items-center text-xs' },
                            React.createElement('span', { className: 'text-slate-400' },
                                React.createElement('span', { className: 'text-blue-400 font-medium' }, '🔵 CoinGecko:'),
                                ' Ranking · Market Cap',
                            ),
                            React.createElement('span', { className: 'text-slate-400' },
                                React.createElement('span', { className: 'text-yellow-400 font-medium' }, '🟡 Bybit:'),
                                ' RSI · Momentum · Spread · Profundidade · Score',
                            ),
                            React.createElement('span', { className: 'text-slate-500 ml-auto text-xs' },
                                '⚡ Dados carregados sob demanda · sem atualização automática',
                            ),
                        ),

                        // Content
                        erro
                            ? React.createElement('div', { className: 'p-8' },
                                React.createElement('div', { className: 'flex items-start gap-3 p-4 bg-red-950/30 border border-red-800/50 rounded-lg' },
                                    React.createElement('svg', {
                                        className: 'w-5 h-5 text-red-400 flex-shrink-0 mt-0.5',
                                        viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2',
                                    },
                                        React.createElement('circle', { cx: '12', cy: '12', r: '10' }),
                                        React.createElement('line',   { x1: '12', y1: '8',  x2: '12',    y2: '12' }),
                                        React.createElement('line',   { x1: '12', y1: '16', x2: '12.01', y2: '16' }),
                                    ),
                                    React.createElement('p', { className: 'text-red-200' }, erro),
                                ),
                            )
                            : carregando
                                ? React.createElement(BarraProgresso, { prog, fase })
                                : pares.length === 0
                                    ? React.createElement('div', { className: 'p-12 text-center text-slate-400' },
                                        estado === 'idle'
                                            ? React.createElement('div', { className: 'inline-flex flex-col items-center gap-4' },
                                                React.createElement('div', { className: 'relative w-12 h-12' },
                                                    React.createElement('div', { className: 'absolute inset-0 bg-cyan-500 rounded-full animate-pulse' }),
                                                    React.createElement('div', { className: 'absolute inset-2 bg-slate-900 rounded-full' }),
                                                ),
                                                React.createElement('p', null, 'Carregando dados...'),
                                            )
                                            : 'Nenhum par encontrou os critérios. Tente atualizar.',
                                    )
                                    : React.createElement('div', { className: 'overflow-x-auto' },
                                        React.createElement('table', { className: 'w-full' },
                                            React.createElement('thead', null,
                                                React.createElement('tr', { className: 'bg-slate-800/60 border-b border-slate-700' },
                                                    cabecalhos.map(h =>
                                                        React.createElement('th', {
                                                            key: h.label,
                                                            className: `px-3 py-4 ${h.align} text-xs font-semibold text-slate-300 uppercase tracking-wider`,
                                                        }, h.label),
                                                    ),
                                                ),
                                            ),
                                            React.createElement('tbody', null,
                                                pares.map(par => React.createElement(LinhaTabela, { key: par.simbolo, par })),
                                            ),
                                        ),
                                    ),

                        // Footer
                        pares.length > 0 && React.createElement('div', { className: 'px-8 py-4 bg-slate-800/40 border-t border-slate-800 text-sm text-slate-400' },
                            '✓ ',
                            React.createElement('span', { className: 'font-semibold text-slate-300' }, pares.length),
                            ' pares · ordenados por score · passe o cursor nos filtros para ver critérios',
                        ),
                    ),

                    // Footer info
                    React.createElement('div', { className: 'mt-8 text-center text-xs text-slate-500' },
                        React.createElement('p', null,
                            'Dados: ',
                            React.createElement('span', { className: 'text-slate-400 font-medium' }, 'CoinGecko API'),
                            ' + ',
                            React.createElement('span', { className: 'text-slate-400 font-medium' }, 'Bybit API'),
                            ' · Sem chave de API necessária',
                        ),
                    ),
                ),
            );
        }

        createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>
